name: Build Koeur APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Donner les permissions à Gradle
        run: chmod +x ./gradlew

      - name: Vérifier Gradle
        run: ./gradlew --version

      - name: Nettoyer
        run: ./gradlew clean --no-daemon

      - name: Compiler Koeur
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Vérifier l'APK
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "❌ APK introuvable"
            exit 1
          fi

          echo "✅ APK créé avec succès"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: koeur-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
        with:
          name: koeur-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
