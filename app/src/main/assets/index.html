<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koeur ♥</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
async function blockUser(profileId){

    if(!confirm("Bloquer cette personne ?")) return;

    const {error} = await db
        .from("blocks")
        .insert({
            blocker_id: currentUser.id,
            blocked_id: profileId
        });

    if(error){
        alert(error.message);
        return;
    }

    alert("Profil bloqué.");
    await loadProfiles();
}

async function reportUser(profileId){

    const reason = prompt(
        "Pourquoi veux-tu signaler ce profil ?"
    );

    if(!reason) return;

    const {error} = await db
        .from("reports")
        .insert({
            reporter_id: currentUser.id,
            reported_id: profileId,
            reason: reason
        });

    if(error){
        alert(error.message);
        return;
    }

    alert("Signalement envoyé.");
}

async function getCompatibility(profileId){

    const {data,error} = await db
        .rpc("compatibility_score", {
            user1: currentUser.id,
            user2: profileId
        });

    if(error) return 0;

    return data || 0;
}

</script>
<style>
body{margin:0;font-family:Arial;background:#f7f6fa;color:#18131b}
.app{max-width:480px;margin:auto;min-height:100vh;background:white}
header{padding:18px;font-size:28px;font-weight:bold;color:#ff3d78}
main{padding:18px 18px 90px}
section{display:none}.active{display:block}
input,textarea,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:12px;border:1px solid #ddd}
button{background:#ff3d78;color:white;border:0;font-weight:bold}
.secondary{background:#eee;color:#222}
.card{padding:18px;border-radius:20px;background:#faf8ff;margin:12px 0}
.nav{position:fixed;bottom:0;width:min(480px,100%);display:flex;background:white;border-top:1px solid #ddd}
.nav button{background:white;color:#555;border-radius:0;margin:0}
h1{margin-top:0}
.small{color:#777;font-size:13px}
</style>
</head>

<body>
<div class="app">

<header>Koeur ♥</header>

<main>

<section id="auth" class="active">
<h1>Bienvenue ❤️</h1>
<p>Rencontre des personnes qui partagent tes valeurs.</p>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Mot de passe">
<input id="firstName" placeholder="Prénom">
<input id="birthDate" type="date">
<input id="city" placeholder="Ville">

<button onclick="signup()">Créer mon compte</button>
<button class="secondary" onclick="login()">Se connecter</button>

<p id="authMsg" class="small"></p>
</section>

<section id="discover">
<h1>Découvrir 💕</h1>
<div id="profiles"></div>
</section>

<section id="matches">
<h1>Mes matchs 💕</h1>
<div id="matchesList"></div>
</section>

<section id="messages">
<h1>Messages 💬</h1>
<div id="messagesList"></div>
<input id="messageInput" placeholder="Écrire un message">
<button onclick="sendMessage()">Envoyer</button>
</section>

<section id="profile">
<h1>Mon profil 👤</h1>
<div id="myProfile"></div>
<button class="secondary" onclick="logout()">Se déconnecter</button>
</section>

</main>

<div class="nav" id="nav" style="display:none">
<button onclick="show('discover');loadProfiles()">💕<br>Découvrir</button>
<button onclick="show('matches');loadMatches()">💖<br>Matchs</button>
<button onclick="show('messages');loadMatches()">💬<br>Messages</button>
<button onclick="show('profile');loadProfile()">👤<br>Profil</button>
</div>

</div>

<script>
const SUPABASE_URL="https://sttmiacttpkvzunlggog.supabase.co";
const SUPABASE_KEY="sb_publishable_RKRc0ZugsLnIyFpuKz1org_Y0gxBNwq";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null;
let selectedMatch=null;

function show(id){
 document.querySelectorAll("section").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const first_name=document.getElementById("firstName").value.trim();
 const birth_date=document.getElementById("birthDate").value;
 const city=document.getElementById("city").value.trim();

 if(!email||!password||!first_name||!birth_date){
  authMsg.textContent="Remplis tous les champs obligatoires.";
  return;
 }

 const {data,error}=await db.auth.signUp({
  email,
  password,
  options:{data:{first_name,birth_date}}
 });

 if(error){
  authMsg.textContent=error.message;
  return;
 }

 if(data.user){
  await db.from("profiles").upsert({
   id:data.user.id,
   first_name,
   birth_date,
   city
  });
 }

 authMsg.textContent="Compte créé. Vérifie ton email si nécessaire.";
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 const {data,error}=await db.auth.signInWithPassword({email,password});

 if(error){
  authMsg.textContent=error.message;
  return;
 }

 user=data.user;
 await startApp();
}

async function startApp(){
 document.getElementById("auth").classList.remove("active");
 document.getElementById("nav").style.display="flex";
 show("discover");
 await loadProfiles();
}

async function loadProfiles(){
 const {data,error}=await db
  .from("profiles")
  .select("*")
  .neq("id",user.id)
  .limit(20);

 if(error){
  profiles.innerHTML="<p>Erreur de chargement.</p>";
  return;
 }

 if(!data.length){
  profiles.innerHTML="<p>Aucun profil disponible pour le moment.</p>";
  return;
 }

 profiles.innerHTML=data.map(p=>`
 <div class="card">
  <h2>${escapeHtml(p.first_name)}, ${age(p.birth_date)}</h2>
  <p>📍 ${escapeHtml(p.city||"")}</p>
  <p>${escapeHtml(p.bio||"Pas encore de présentation.")}</p>
  <button onclick="likeUser('${p.id}')">❤️ J'aime</button>
 </div>
 `).join("");
}

async function likeUser(id){
 const {error}=await db.from("likes").insert({
  from_user:user.id,
  to_user:id
 });

 if(error && !error.message.includes("duplicate")){
  alert(error.message);
  return;
 }

 alert("Koeur envoyé ❤️");

 await loadMatches();
}

async function loadMatches(){
 const {data,error}=await db
  .from("matches")
  .select("*")
  .or(`user_a.eq.${user.id},user_b.eq.${user.id}`);

 if(error){
  matchesList.innerHTML="<p>Erreur.</p>";
  return;
 }

 if(!data.length){
  matchesList.innerHTML="<p>Pas encore de match.</p>";
  return;
 }

 const ids=data.map(m=>m.user_a===user.id?m.user_b:m.user_a);

 const {data:profiles}=await db
  .from("profiles")
  .select("*")
  .in("id",ids);

 matchesList.innerHTML=(profiles||[]).map(p=>`
 <div class="card">
  <h2>${escapeHtml(p.first_name)}</h2>
  <p>💕 Vous vous êtes likés !</p>
  <button onclick="openChat('${findMatch(data,p.id)?.id||""}')">💬 Message</button>
 </div>
 `).join("");
}

function findMatch(list,id){
 return list.find(m=>m.user_a===id||m.user_b===id);
}

async function openChat(matchId){
 selectedMatch=matchId;
 show("messages");
 await loadMessages();
}

async function loadMessages(){
 if(!selectedMatch){
  messagesList.innerHTML="<p>Sélectionne un match.</p>";
  return;
 }

 const {data,error}=await db
  .from("messages")
  .select("*")
  .eq("match_id",selectedMatch)
  .order("created_at",{ascending:true});

 if(error){
  messagesList.textContent=error.message;
  return;
 }

 messagesList.innerHTML=(data||[]).map(m=>`
 <div class="card">
  <b>${m.sender_id===user.id?"Moi":"Match"}</b>
  <p>${escapeHtml(m.content)}</p>
 </div>
 `).join("");
}

async function sendMessage(){
 if(!selectedMatch)return;

 const input=document.getElementById("messageInput");
 const content=input.value.trim();

 if(!content)return;

 const {error}=await db.from("messages").insert({
  match_id:selectedMatch,
  sender_id:user.id,
  content
 });

 if(error){
  alert(error.message);
  return;
 }

 input.value="";
 await loadMessages();
}

async function loadProfile(){
 const {data,error}=await db
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .single();

 if(error)return;

 myProfile.innerHTML=`
 <div class="card">
  <h2>${escapeHtml(data.first_name)}</h2>
  <p>📍 ${escapeHtml(data.city||"")}</p>
  <p>${escapeHtml(data.bio||"")}</p>
 </div>`;
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

function age(date){
 const d=new Date(date);
 const now=new Date();
 let a=now.getFullYear()-d.getFullYear();
 if(now.getMonth()<d.getMonth() ||
   (now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))a--;
 return a;
}

function escapeHtml(value){
 return String(value||"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

(async()=>{
 const {data}=await db.auth.getSession();

 if(data.session){
  user=data.session.user;
  await startApp();
 }
})();

async function blockUser(profileId){

    if(!confirm("Bloquer cette personne ?")) return;

    const {error} = await db
        .from("blocks")
        .insert({
            blocker_id: currentUser.id,
            blocked_id: profileId
        });

    if(error){
        alert(error.message);
        return;
    }

    alert("Profil bloqué.");
    await loadProfiles();
}

async function reportUser(profileId){

    const reason = prompt(
        "Pourquoi veux-tu signaler ce profil ?"
    );

    if(!reason) return;

    const {error} = await db
        .from("reports")
        .insert({
            reporter_id: currentUser.id,
            reported_id: profileId,
            reason: reason
        });

    if(error){
        alert(error.message);
        return;
    }

    alert("Signalement envoyé.");
}

async function getCompatibility(profileId){

    const {data,error} = await db
        .rpc("compatibility_score", {
            user1: currentUser.id,
            user2: profileId
        });

    if(error) return 0;

    return data || 0;
}

</script>

</body>
</html>
